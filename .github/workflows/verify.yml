name: verify

# The palette is a constraint solve, not a set of picks. This is what stops
# it drifting: solve.py re-derives every declared token and asserts the
# contrast windows, the sRGB gamut ceilings, the AA floor for coloured type,
# and the separation floor across the categorical series.
#
# It also checks the Tailwind bridge, because that failure mode is silent: a
# theme key pointing at a variable that no longer exists compiles cleanly and
# renders nothing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tokens:
    name: token constraints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the token constraints still hold
        run: python3 tools/solve.py verify   # includes the bridge check
      - name: Report separation across the categorical series
        run: python3 tools/solve.py separation

  registry:
    name: registry manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The repo is the registry: shadcn reads registry.json straight from
      # GitHub, so a malformed manifest breaks installs with nothing to catch
      # it. Building it here is the validation.
      - name: Validate registry.json
        run: npx --yes shadcn@latest build registry.json --output "$RUNNER_TEMP/r"
